name: Build Service Sender Image

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - '**/*.md'
      - docs/**
      - .github/**
      - .env
      - .env.example

concurrency:
  group: service-sender-image-build-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push AMD64 and ARM64 images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/service-sender-api:latest
            ghcr.io/${{ github.repository_owner }}/service-sender-api:${{ github.sha }}
