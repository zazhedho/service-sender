name: Deploy Service Sender

on:
  workflow_run:
    workflows: ["Build Service Sender Image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: VPS tujuan
        type: choice
        required: true
        default: oci-arm64
        options:
          - oci-arm64
          - vps-amd64

concurrency:
  group: service-sender-deploy-${{ github.event.inputs.target || 'oci-arm64' }}
  cancel-in-progress: false

permissions:
  actions: read

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: Production
    env:
      TARGET: ${{ github.event.inputs.target || 'oci-arm64' }}
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Verify build for manually selected commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          successful_runs="$(gh api "repos/${GH_REPOSITORY}/actions/workflows/build.yml/runs?head_sha=${DEPLOY_SHA}&branch=main&per_page=100" --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          if [[ "$successful_runs" -lt 1 ]]; then
            echo "No successful main build found for ${DEPLOY_SHA}."
            exit 1
          fi

      - name: Deploy exact image
        env:
          OCI_VPS_HOST: ${{ secrets.OCI_VPS_HOST }}
          OCI_VPS_USER: ${{ secrets.OCI_VPS_USER }}
          OCI_VPS_SSH_KEY: ${{ secrets.OCI_VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail

          case "$TARGET" in
            oci-arm64)
              deploy_host="$OCI_VPS_HOST"
              deploy_user="$OCI_VPS_USER"
              deploy_key="$OCI_VPS_SSH_KEY"
              expected_arch=arm64
              ;;
            vps-amd64)
              deploy_host="$VPS_HOST"
              deploy_user="$VPS_USER"
              deploy_key="$VPS_SSH_KEY"
              expected_arch=amd64
              ;;
            *)
              echo "Unsupported deployment target: ${TARGET}."
              exit 1
              ;;
          esac

          if [[ -z "$deploy_host" || -z "$deploy_user" || -z "$deploy_key" ]]; then
            echo "Missing host, user, or SSH key secret for ${TARGET}."
            exit 1
          fi
          if [[ ! "$deploy_host" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ || ! "$deploy_user" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]; then
            echo "Invalid host or user secret for ${TARGET}."
            exit 1
          fi
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid deployment commit SHA."
            exit 1
          fi

          image_ref="ghcr.io/${GITHUB_REPOSITORY_OWNER}/service-sender-api:${DEPLOY_SHA}"
          if [[ ! "$image_ref" =~ ^ghcr\.io/[A-Za-z0-9_.-]+/service-sender-api:[0-9a-f]{40}$ ]]; then
            echo "Invalid deployment image reference."
            exit 1
          fi

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          key_file="${temp_dir}/id_ed25519"
          known_hosts="${temp_dir}/known_hosts"
          umask 077
          printf '%s\n' "$deploy_key" > "$key_file"

          ssh-keyscan -T 10 -H "$deploy_host" > "$known_hosts" 2>/dev/null
          if [[ ! -s "$known_hosts" ]]; then
            echo "Could not scan SSH host key for ${TARGET}."
            exit 1
          fi

          ssh \
            -i "$key_file" \
            -o UserKnownHostsFile="$known_hosts" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PasswordAuthentication=no \
            -o PreferredAuthentications=publickey \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "${deploy_user}@${deploy_host}" \
            "bash -s -- '${image_ref}' '${expected_arch}'" <<'REMOTE'
          set -euo pipefail
          image_ref="$1"
          expected_arch="$2"

          if [[ ! "$image_ref" =~ ^ghcr\.io/[A-Za-z0-9_.-]+/service-sender-api:[0-9a-f]{40}$ ]]; then
            echo "Invalid deployment image reference."
            exit 1
          fi

          case "$expected_arch:$(uname -m)" in
            arm64:aarch64|amd64:x86_64) ;;
            *)
              echo "Target architecture mismatch: expected ${expected_arch}, got $(uname -m)."
              exit 1
              ;;
          esac

          app_dir=/opt/apps/service-sender
          compose_file="${app_dir}/compose.yml"
          env_file="${app_dir}/.env"
          if [[ ! -r "$compose_file" ]] || ! sudo -n test -r "$env_file"; then
            echo "Compose file or environment file is missing in ${app_dir}."
            exit 1
          fi

          override_file="$(mktemp /tmp/service-sender-override.XXXXXX.yaml)"
          trap 'rm -f "$override_file"' EXIT
          cat > "$override_file" <<EOF
          services:
            service_sender:
              image: ${image_ref}
          EOF

          sudo -n docker compose -f "$compose_file" -f "$override_file" config --quiet
          sudo -n docker compose -f "$compose_file" -f "$override_file" pull service_sender
          sudo -n docker compose -f "$compose_file" -f "$override_file" up -d --no-deps service_sender

          container_id="$(sudo -n docker compose -f "$compose_file" -f "$override_file" ps -q service_sender)"
          if [[ -z "$container_id" || "$(sudo -n docker inspect --format '{{.State.Status}}' "$container_id")" != running ]]; then
            echo "Service sender container is not running after deployment."
            exit 1
          fi
          if [[ "$(sudo -n docker inspect --format '{{.Config.Image}}' "$container_id")" != "$image_ref" ]]; then
            echo "Service sender container is not using the requested image."
            exit 1
          fi
          image_id="$(sudo -n docker inspect --format '{{.Image}}' "$container_id")"
          if [[ "$(sudo -n docker image inspect --format '{{.Architecture}}' "$image_id")" != "$expected_arch" ]]; then
            echo "Service sender image architecture does not match ${expected_arch}."
            exit 1
          fi
          REMOTE
